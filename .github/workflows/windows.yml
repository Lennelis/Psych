name: Windows

# The repo's main.yml builds Linux, Windows and macOS but only triggers on main and
# experimental, so it stays dormant on this branch. This is the same Windows job it
# uses, pointed at this branch, so a push here produces a zip you can run.

on:
  push:
    branches: [claude/vslice-freeplay, psych-slice]
  workflow_dispatch:

jobs:
  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > /dev/null --quiet
          .\"setup/windows.bat"
        shell: cmd

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd

      # SDL knows exactly when a key went down; lime 8.1.2 drops the number on the way
      # through, so the game can only place a press in the frame it noticed it.
      # patches/lime-precise-input/ carries it through, which means rebuilding lime's
      # native library - the patch is C++ as well as Haxe.
      #
      # Allowed to fail. Without it the game falls back to the half-frame estimate it
      # used before any of this existed.
      - name: Rebuild lime with input timestamps
        id: precise
        continue-on-error: true
        shell: bash
        run: ./setup/patch-lime.sh -Dwindows -DHXCPP_M64

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      # -D officialBuild is load-bearing: Project.xml hangs BASE_GAME_FILES and
      # VIDEOS_ALLOWED off it, so without it the build ships with no week 1-7 songs.
      # PATCHED_LIME only when the step above got all the way through: a lime that was
      # patched but failed to rebuild reports no timestamps rather than wrong ones, but
      # a lime that never took the patch has no onKeyDownPrecise for PreciseInput to
      # hook, and the game would not compile.
      - name: Compile
        shell: bash
        run: |
          FLAGS="-D officialBuild"
          if [ "${{ steps.precise.outcome }}" = "success" ]; then
            FLAGS="$FLAGS -D PATCHED_LIME"
          else
            echo "Building without precise input - see the lime rebuild step."
          fi
          haxelib run lime build windows --app-version="4.0.0-${{ github.run_id }}" $FLAGS

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsBuild
          path: export/release/windows/bin
