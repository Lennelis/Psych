name: Android

# Stock Psych has no touch controls, so this APK is only playable with a bluetooth
# controller or keyboard - see docs/CHANGES.md. It exists so the branch can be run on
# a phone at all; the playable mobile build lives on the P-Slice fork branch.

on:
  push:
    branches: [claude/psych-ghost-tap-healthbar]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      # ANDROID_SETUP gates the android target before lime even looks at the SDK and NDK
      # paths, so having those three right is not enough on its own.
      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      # Generated per run rather than committed. An unsigned release APK will not
      # install; this one will, but each build is signed with a different key, so
      # uninstall the previous build rather than installing over it.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -keystore setup/debug.keystore -storepass psychdebug \
            -keypass psychdebug -alias psychdebug -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Psych Engine Test Build, OU=None, O=None, L=None, S=None, C=US"

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      # -D officialBuild is load-bearing: Project.xml hangs BASE_GAME_FILES off it, so
      # without it the build ships with no week 1-7 songs.
      - name: Compile
        run: haxelib run lime build android -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
