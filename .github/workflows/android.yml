name: Android

# Upstream's main.yml builds every target and needs P-Slice's own Firebase and
# release-signing secrets, which a fork doesn't have. This builds just the
# Android APK, with Firebase off and the repo's own key.keystore doing the
# signing (Project.xml already wires that up for non-debug android builds).

on:
  push:
    branches: [claude/psych-engine-mobile-port-9sau2w]
  workflow_dispatch:

jobs:
  Libraries:
    name: Build Caches
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-24.04
      CACHE_NAME: P-Slice.1.0.android-only-cache
      setupScript: sh ./setup/mobile.sh

  Android:
    name: Android
    needs: Libraries
    runs-on: ubuntu-24.04
    env:
      HAXE_VERSION: 4.3.6
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore libraries
        uses: actions/cache@v3
        with:
          key: P-Slice.1.0.android-only-cache
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            P-Slice.1.0.android-only-cache

      - name: Restore build cache
        uses: actions/cache@v3
        with:
          key: P-Slice.1.0.android-only-build
          path: |
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            P-Slice.1.0.android-only-build

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -DNO_FIREBASE

      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: PSliceEngine-android
          path: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error

      - name: Clear the old build cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "P-Slice.1.0.android-only-build") {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
              }
            }

      - name: Save the build cache
        uses: actions/cache@v3
        with:
          key: P-Slice.1.0.android-only-build
          path: |
            export/release/android/haxe/
            export/release/android/obj/
