# Builds an installable Android APK and uploads it as a workflow artifact.
#
# This exists so you don't need an Android SDK, an NDK or a JDK on your own
# machine to get a build onto a phone. docs/MOBILE.md covers building locally.

name: Build Android APK

on:
  push:
    branches: [ claude/psych-engine-mobile-port-9sau2w, claude/vslice-freeplay ]

  # Run it by hand from the Actions tab, with these switches.
  workflow_dispatch:
    inputs:
      videos:
        description: 'Include video cutscenes (hxvlc). The most fragile native dependency - leave off if the build fails in it.'
        type: boolean
        default: false
      armv7:
        description: 'Also build 32-bit armeabi-v7a. Roughly doubles the build time; only needed for phones older than about 2016.'
        type: boolean
        default: false

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    # hxcpp compiles the whole engine from scratch, which is slow. This is well
    # above a normal run and only there so a hung build gives up on its own.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4.1.7

      # Lime 8.1.2 generates Gradle 7.4.2 with Android Gradle Plugin 7.3.1, and
      # neither runs on a JDK newer than 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # NDK r21e specifically: newer NDKs changed the toolchain layout hxcpp
      # expects, and the failure shows up deep inside a C++ compile where the
      # error tells you nothing useful.
      - name: Install the Android NDK and SDK pieces
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;21.4.7075529" "platforms;android-33" "build-tools;33.0.2"

          # Lime reads all of these straight from the environment, which is what
          # lets this run without `lime setup android` asking questions. Together
          # they're exactly what that command would have written to its config:
          # the two paths, JAVA_HOME (already set by setup-java), and the
          # ANDROID_SETUP flag, which lime checks on its own before anything else
          # and refuses the target without.
          echo "ANDROID_SETUP=true" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          # The runner ships build-tools newer than AGP 7.3.1 expects, and lime
          # would otherwise pick the newest one it finds.
          echo "ANDROID_BUILD_TOOLS=33.0.2" >> $GITHUB_ENV

      - name: Cache Haxe libraries
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-${{ hashFiles('setup/android.sh') }}

      - name: Install Haxe libraries
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib setup ~/haxelib
          chmod +x ./setup/android.sh
          ./setup/android.sh

      - name: Point haxelib at the cache
        if: steps.haxelib-cache.outputs.cache-hit == 'true'
        run: haxelib setup ~/haxelib

      # Android will only install a new build over an old one when both are signed by
      # the same key. A key made fresh each run means every APK is a stranger to the
      # last, so the old one has to be uninstalled first - which takes the save file
      # and every setting with it.
      #
      # So the key is kept. If the repo has the secrets set it uses those, which is
      # the right answer for a public repo: the key never touches the tree, and it is
      # the same key on every branch for as long as the secret is set.
      #
      # Failing that it falls back to one held in the Actions cache. That is stable
      # most of the time and not guaranteed, because an Actions cache is not storage:
      # it is scoped to the branch that wrote it, so a second branch building this
      # workflow makes its own key and the two branches' APKs will not replace each
      # other; it is dropped after seven days without a hit; and it is evicted
      # least-recently-used once the repository passes its cache quota, which the
      # haxelib caches above take a real share of. Any of those means the next key is
      # a new one, and the first install after it is refused.
      #
      # The fingerprint is printed below on every run, so which of those happened is a
      # question the logs can answer.
      #
      # It is deliberately not committed. This repo is public, and a signing key in it
      # would let anyone build an APK that Android accepts as an upgrade to this app.
      # docs/MOBILE.md has the two secrets to set.
      # Only ever holds the fallback key. A key from secrets is written straight to
      # ci.keystore below and never goes near this path, so it cannot end up cached.
      - name: Restore the fallback signing key
        uses: actions/cache@v4
        with:
          path: signing/fallback.keystore
          key: android-signing-key-v1

      - name: Set up signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          # The certificate's fingerprint, printed on every run. It is the public half
          # of the key - the thing Android compares when deciding whether one APK may
          # replace another - so there is nothing to hide, and having it in the log is
          # the only way to tell an evicted key from a phone with another Psych Engine
          # on it when an install is refused.
          show_fingerprint() {
            echo "Signing certificate:"
            keytool -list -v -keystore "$PWD/ci.keystore" -alias "$1" -storepass "$2" 2>/dev/null \
              | grep -i 'SHA256:' || echo "  (could not read it)"
          }

          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using the keystore from repository secrets."
            echo "$KEYSTORE_B64" | base64 -d > "$PWD/ci.keystore"
            echo "ANDROID_KEYSTORE=ci.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_ALIAS=${KEYSTORE_ALIAS:-psychengine}" >> $GITHUB_ENV
            show_fingerprint "${KEYSTORE_ALIAS:-psychengine}" "$KEYSTORE_PASSWORD"
            exit 0
          fi

          mkdir -p signing
          if [ ! -f signing/fallback.keystore ]; then
            echo "::warning::No cached signing key - a new one was made, so this APK will not"
            echo "::warning::install over an existing Psych Engine. Uninstall first, or set the"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret to stop this happening again."
            keytool -genkeypair -keystore signing/fallback.keystore -alias psychengine \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass psychengine -keypass psychengine \
              -dname "CN=Psych Engine, OU=CI, O=Psych Engine, C=US"
          else
            echo "Reusing the cached key, so this build installs over the last one."
          fi
          cp signing/fallback.keystore "$PWD/ci.keystore"

          echo "ANDROID_KEYSTORE=ci.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=psychengine" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_ALIAS=psychengine" >> $GITHUB_ENV
          show_fingerprint psychengine psychengine

      - name: Build the APK
        env:
          # :app:packageRelease died with an OutOfMemoryError zipping the APK. This
          # build packs roughly 320MB, which is more than the Gradle daemon's default
          # heap copes with, and lime leaves org.gradle.jvmargs commented out in the
          # gradle.properties it generates - so raising it there would be overwritten
          # on the next build. Passing it as a system property survives that.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: |
          # officialBuild is what pulls in the weeks and songs; without it the
          # game boots to an empty menu, which is no use for testing the controls.
          FLAGS="-D officialBuild"

          if [ "${{ inputs.videos }}" != "true" ]; then
            FLAGS="$FLAGS -D NO_VIDEOS"
          fi

          if [ "${{ inputs.armv7 }}" = "true" ]; then
            FLAGS="$FLAGS -D ARMV7"
          fi

          echo "Building with: $FLAGS"
          haxelib run lime build android -release $FLAGS

      - name: Find the APK
        id: apk
        run: |
          APK=$(find export -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "No signed APK was produced. Everything found under export:"
            find export -name '*.apk' || echo "  (no .apk at all)"
            exit 1
          fi
          echo "Built $APK ($(du -h "$APK" | cut -f1))"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: PsychEngine-android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A failed hxcpp or Gradle build says almost nothing in the step log; these
      # are the files that actually explain what happened.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: android-build-logs
          path: |
            export/release/android/haxe/
            export/release/android/bin/app/build/outputs/logs/
          if-no-files-found: ignore
